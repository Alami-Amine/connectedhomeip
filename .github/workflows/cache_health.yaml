# Scope: the GitHub Actions cache quota only (macOS bootstrap, ccache, CodeQL TRAP).
# Linux bootstrap is on BuildJet and Namespace runners have their own cache volumes;
# neither counts against this quota nor appears here.

name: GitHub Actions Cache Health

on:
    schedule:
        - cron: "20 */6 * * *"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}

permissions:
    actions: read
    contents: read

jobs:
    check_cache_health:
        name: Check GitHub Actions Cache Health
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            # Alarms on restore outcomes across runs, not on a point-in-time listing:
            # entries here are evicted under quota pressure and rewritten by the next
            # run, so a key absent from one snapshot is a phase of that cycle, not an
            # incident. Sampling costs one job-log download per matched job.
            - name: Measure ccache restore outcomes
              run: |
                  python3 scripts/tools/check_cache_health.py \
                    --summary-file "$GITHUB_STEP_SUMMARY" \
                    --alarm-file cache-alarm.txt \
                    --since-days 3 \
                    --workflow tests.yaml \
                    --workflow nightly.yaml \
                    --workflow darwin-tests.yaml \
                    --job-pattern 'Test Suites|REPL Tests' \
                    --miss-threshold 0.25 \
                    --min-samples 5
              env:
                  GH_TOKEN: ${{ github.token }}

            - name: Notify Slack on Failure
              if: failure()
              uses: ./.github/actions/notify-slack-failure
              with:
                  slack-webhook: ${{ secrets.SWTT_SLACK_WEBHOOK }}
                  job-name: "GitHub Actions Cache Health"
                  extra-details-file: cache-alarm.txt
